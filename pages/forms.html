    <div>
        <h1>Formulário de Inscrição</h1>
        <p>Preencha o formulário abaixo para se inscrever:</p>
        <form action="inscricao-sucesso.html" method="post">
            <label for="primeiro-nome" id="label-primeiro-nome">Primeiro Nome:</label><br>
            <input type="text" id="input-primeiro-nome" name="primeiro-nome" required placeholder="Primeiro Nome">
            <input type="text" id="input-ultimo-nome" name="ultimo-nome" required placeholder="Último Nome"><br><br>
            <label for="username" id="label-username">Nome de Usuário:</label><br>
            <input type="text" id="input-username" name="username" placeholder="Digite seu nome de usuário" required><br><br>
            <label for="email" id="label-email">Email:</label><br>
            <input type="email" id="input-email" name="email" placeholder="Digite seu email" required><br><br>
            <label for="password" id="label-password">Palavra-passe:</label><br>
            <input type="password" id="input-password" name="password" placeholder="Digite sua palavra-passe" required><br><br>
            <label for="confirm-password" id="label-confirm-password">Confirmar Palavra-passe:</label><br>
            <input type="password" id="input-confirm-password" name="confirm-password" placeholder="Confirme sua palavra-passe" required><br><br>
            <input type="checkbox" id="input-termos" name="termos" required> <label for="input-termos">Aceito os termos e condições.</label><br><br>
            <select id="input-ufcd" name="ufcd" required>
                <option value="blank-ufcd" selected disabled hidden id="option-ufcd">Selecione a UFCD</option>
                <option value="ufcd-9963" id="option-ufcd-9963">UFCD 9963 (Edição Web)</option>
                <option value="ufcd-0154" id="option-ufcd-0154">UFCD 0154 (Stilos em CSS)</option>
            </select><br><br>
            <button type="submit" value="Enviar">Guardar Inscrição</button>
        </form>
    </div>
</body>
