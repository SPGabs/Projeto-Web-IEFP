    <h1>Formulário de Contato</h1>
    <form action="pages/contato-sucess.html" method="post">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required placeholder="Primeiro Nome">
        <input type="text" id="ultimo-nome" name="sobrenome" required placeholder="Último Nome"><br><br>
        <label for="genero">Pronome de tratamento:</label><br>
        <input type="radio" name="genero" value="masculino" required><label for="masculino">Masculino</label>
        <input type="radio" name="genero" value="feminino" required> <label for="feminino">Feminino</label>
        <input type="radio" name="genero" value="outro" required> <label for="outro">Neutro</label><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required placeholder="email@exemplo.com"><br><br>
        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone" required placeholder="telefone de contato"><br><br>
        <select name="assunto" id="assunto" required>
            <option value="">Selecione o assunto</option>
            <option value="informacoes">Informações</option>
            <option value="orcamento">Orçamento</option>
            <option value="reclamacao">Reclamação</option>
        </select><br><br>
        <label for="mensagem">Mensagem:</label><br>
        <textarea rows="4" cols="45" id="mensagem" name="mensagem" required
            placeholder="Digite sua mensagem"></textarea><br><br>
        <button type="submit" value="Enviar">Solicitar Contato</button>
    </form>
</body>

</html>
